    <p id="press-status" role="status">Loading articles…</p><button id="press-retry" type="button" hidden>TRY AGAIN</button>

    <div id="press-image-stage" tabindex="0" role="region" aria-label="Scanned article page; scroll to explore when zoomed"><img id="press-full-image" alt=""></div><p id="press-caption"></p>
  </dialog>
